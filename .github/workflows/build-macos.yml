name: Build macOS VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target SceneLooper_VST3 --parallel 3

      - name: Package VST3
        run: |
          mkdir -p artifact
          find build -name "SceneLooper.vst3" -print
          VST3_PATH=$(find build -name "SceneLooper.vst3" -type d | head -n 1)
          cp -R "$VST3_PATH" artifact/
          cd artifact
          zip -r SceneLooper-macOS-v0.2.zip SceneLooper.vst3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SceneLooper-macOS-v0.2
          path: artifact/SceneLooper-macOS-v0.2.zip
